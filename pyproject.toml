[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llm-redteam-kit"
version = "1.0.0"
description = "Modular, reproducible LLM red-teaming framework for authorized security assessments."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "LRTK Maintainers" }]
keywords = [
    "llm",
    "security",
    "redteam",
    "jailbreak",
    "prompt-injection",
    "authorized-testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "SQLAlchemy>=2.0.30",
    "aiosqlite>=0.20",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# HTTP-native target adapters work out of the box; the official vendor SDKs
# are only needed if you build plugins that import them directly.
sdk = [
    "openai>=1.30",
    "anthropic>=0.34",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    # Newer Starlette TestClient releases require httpx2 instead of httpx.
    "httpx2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
lrtk = "llm_redteam.cli.main:app"

# Third-party plugins register a no-argument callable in this group.
# The callable is imported and invoked once at startup.
[project.entry-points."llm_redteam.plugins"]

[project.urls]
Homepage = "https://github.com/ganyuanlin/llm-redteam-kit"
Documentation = "https://github.com/ganyuanlin/llm-redteam-kit/tree/main/docs"
Issues = "https://github.com/ganyuanlin/llm-redteam-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_redteam"]

[tool.hatch.build.targets.sdist]
include = [
    "src/llm_redteam",
    "examples",
    "docs",
    "README.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# B008: FastAPI performs dependency injection via default arguments.
# B027: ABC default no-op methods (Target.aclose / Memory.close) are intentional.
ignore = ["B008", "B027"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=llm_redteam --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    "error",
    # The FastAPI/Starlette/anyio TestClient stack emits deprecation warnings
    # on import across releases; do not let third-party churn fail our suite.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/llm_redteam"]
omit = ["src/llm_redteam/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
